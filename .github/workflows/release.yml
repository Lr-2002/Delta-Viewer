name: Release installers

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.12.1"
  RUST_VERSION: "1.97.1"

jobs:
  controller:
    name: Create or reuse version tag after successful CI
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.bind.outputs.should_release }}
      tag: ${{ steps.bind.outputs.tag }}
      version: ${{ steps.bind.outputs.version }}
      commit: ${{ steps.bind.outputs.commit }}
      tag_object: ${{ steps.bind.outputs.tag_object }}
      prerelease: ${{ steps.bind.outputs.prerelease }}
    steps:
      - name: Check out exact CI-passed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create or reuse the version tag
        id: bind
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          release_commit="$RELEASE_COMMIT"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "workflow_run did not provide a full commit SHA" >&2
            exit 1
          }

          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main" --tags
          main_commit="$(git rev-parse origin/main)"
          [[ "$release_commit" == "$main_commit" ]] || {
            echo "CI commit $release_commit is no longer the main head $main_commit; skipping this older CI run" >&2
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [[ "$(git rev-parse HEAD)" == "$release_commit" ]] || {
            echo "Checked-out commit does not match the CI-passed commit" >&2
            exit 1
          }

          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Package version does not produce a valid release tag: $tag" >&2
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release_exists=false
          release_is_draft=false
          if gh release view "$tag" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            release_exists=true
            release_is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          fi

          tag_needs_push=false
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_type="$(git cat-file -t "refs/tags/$tag")"
            [[ "$tag_type" == "tag" ]] || {
              echo "$tag already exists as a lightweight tag; refusing to replace it" >&2
              exit 1
            }
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_commit" != "$release_commit" ]]; then
              if [[ "$release_exists" == true ]]; then
                echo "$tag is already published or staged for commit $tagged_commit; no release for this commit"
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "$tag already points to $tagged_commit, not $release_commit; bump the version before releasing" >&2
              exit 1
            fi
          else
            git tag -a "$tag" "$release_commit" -m "DOHC Viewer $tag"
            tag_needs_push=true
          fi

          tag_object="$(git rev-parse "refs/tags/$tag")"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]] || {
            echo "The version tag is not an annotated tag object" >&2
            exit 1
          }

          if [[ "$release_exists" == true && "$release_is_draft" != true ]]; then
            echo "$tag already has a published GitHub Release; no work is needed"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          metadata="$RUNNER_TEMP/release-metadata.json"
          node scripts/verify-release.mjs \
            --tag "$tag" \
            --expected-commit "$release_commit" \
            --expected-tag-object "$tag_object" \
            --trusted-main-ref "origin/main" \
            --expected-trusted-main-commit "$main_commit" \
            --output "$metadata"

          if [[ "$tag_needs_push" == true ]]; then
            if git push origin "refs/tags/$tag"; then
              git fetch --force origin "+refs/tags/$tag:refs/tags/$tag"
              remote_tag_object="$(git rev-parse "refs/tags/$tag")"
              [[ "$remote_tag_object" == "$tag_object" ]] || {
                echo "Remote tag object differs from the verified local tag" >&2
                exit 1
              }
            else
              git fetch --force origin "+refs/tags/$tag:refs/tags/$tag" || {
                echo "Tag creation failed and no matching remote tag exists" >&2
                exit 1
              }
              tag_type="$(git cat-file -t "refs/tags/$tag")"
              tagged_commit="$(git rev-list -n 1 "$tag")"
              [[ "$tag_type" == "tag" && "$tagged_commit" == "$release_commit" ]] || {
                echo "Tag creation raced with a remote tag that does not bind to the CI commit" >&2
                exit 1
              }
              tag_object="$(git rev-parse "refs/tags/$tag")"
              node scripts/verify-release.mjs \
                --tag "$tag" \
                --expected-commit "$release_commit" \
                --expected-tag-object "$tag_object" \
                --trusted-main-ref "origin/main" \
                --expected-trusted-main-commit "$main_commit" \
                --output "$metadata"
            fi
          fi

          {
            echo "should_release=true"
            echo "tag=$(jq -r .tag "$metadata")"
            echo "version=$(jq -r .version "$metadata")"
            echo "commit=$(jq -r .commit "$metadata")"
            echo "tag_object=$(jq -r .tagObject "$metadata")"
            echo "prerelease=$(jq -r .prerelease "$metadata")"
          } >> "$GITHUB_OUTPUT"

  windows:
    name: Windows 10+ x64 unsigned installer
    needs: controller
    if: ${{ needs.controller.outputs.should_release == 'true' }}
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      FFMPEG_URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64
      FFMPEG_SHA256: 04e1307997530f9cf2fe35cba2ca7e8875ca91da02f89d6c7243df819c94ad00
      FFMPEG_LICENSE_URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/win32-x64.LICENSE
      FFMPEG_LICENSE_SHA256: 8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903
      FFMPEG_NOTICE_URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/win32-x64.README
      FFMPEG_NOTICE_SHA256: a636a7183c58006351acbaf35303c0ed85c6e1320fd4e80de453ba6157de6311
      FFMPEG_BUILD_ID: ffmpeg-static-b6.1.1-gyan-6.1.1-essentials
      WEBVIEW2_URL: https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/d06c217f-cef1-471d-a639-fad978ef4a40/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
      WEBVIEW2_SHA256: 477c6a0cf79d29fdbfca3ea337fabe952a439b5da38d025cd2c59cc65a87947d
      WEBVIEW2_TAURI_RESOLVER_URL: https://go.microsoft.com/fwlink/?linkid=2124701
    steps:
      - name: Check out bound release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.controller.outputs.commit }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "./src-tauri -> target"
          key: release-windows-x64
          cache-bin: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event.workflow_run.head_sha == needs.controller.outputs.commit }}

      - name: Reverify immutable release provenance
        shell: pwsh
        run: |
          git fetch --force origin "+refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
          node scripts/verify-release.mjs --tag "$env:RELEASE_TAG" --expected-commit "$env:RELEASE_COMMIT" --expected-tag-object "$env:RELEASE_TAG_OBJECT" --trusted-main-ref "HEAD" --expected-trusted-main-commit "$env:RELEASE_COMMIT"
        env:
          RELEASE_TAG: ${{ needs.controller.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.controller.outputs.commit }}
          RELEASE_TAG_OBJECT: ${{ needs.controller.outputs.tag_object }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage reviewed offline WebView2 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WEBVIEW2_URL) -or
              [string]::IsNullOrWhiteSpace($env:WEBVIEW2_SHA256) -or
              [string]::IsNullOrWhiteSpace($env:WEBVIEW2_TAURI_RESOLVER_URL)) {
            throw "Missing reviewed WebView2 source, hash, or Tauri resolver URL"
          }
          $reviewedUri = [Uri]$env:WEBVIEW2_URL
          $expectedPrefix = "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/"
          if (-not $reviewedUri.AbsoluteUri.StartsWith($expectedPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "WEBVIEW2_WINDOWS_X64_URL must be an exact Microsoft filestreamingservice HTTPS URL"
          }
          $segments = $reviewedUri.AbsolutePath.Trim("/").Split("/")
          if ($segments.Count -lt 2) { throw "Pinned WebView2 URL has no GUID/file path" }
          $reviewedGuid = $segments[$segments.Count - 2]
          $reviewedFileName = [Uri]::UnescapeDataString($segments[$segments.Count - 1])
          $parsedGuid = [Guid]::Empty
          if (-not [Guid]::TryParse($reviewedGuid, [ref]$parsedGuid) -or
              [string]::IsNullOrWhiteSpace($reviewedFileName)) {
            throw "Pinned WebView2 URL has an invalid GUID or file name"
          }
          $reviewedRoot = Join-Path $env:RUNNER_TEMP "webview2-reviewed"
          New-Item -ItemType Directory -Force -Path $reviewedRoot | Out-Null
          $reviewedInstaller = Join-Path $reviewedRoot $reviewedFileName
          Invoke-WebRequest -Uri $reviewedUri -OutFile $reviewedInstaller
          $actualHash = (Get-FileHash -LiteralPath $reviewedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WEBVIEW2_SHA256.ToLowerInvariant()) {
            throw "Reviewed WebView2 SHA-256 mismatch"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $reviewedInstaller
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              -not $signature.SignerCertificate.Subject.Contains("Microsoft")) {
            throw "Reviewed WebView2 installer does not have a valid Microsoft signature"
          }

          # Tauri resolves the evergreen URL only to choose a cache key. Bind that key to reviewed bytes.
          $resolverUri = [Uri]$env:WEBVIEW2_TAURI_RESOLVER_URL
          if ($resolverUri.Scheme -ne "https") {
            throw "Tauri WebView2 resolver URL must use HTTPS"
          }
          $resolverResponse = Invoke-WebRequest -Uri $resolverUri -Method Head -MaximumRedirection 10
          [Uri]$resolvedUri = $resolverResponse.BaseResponse.RequestMessage.RequestUri
          if (-not $resolvedUri.AbsoluteUri.StartsWith($expectedPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Tauri WebView2 resolver returned an unexpected URL: $resolvedUri"
          }
          $resolvedSegments = $resolvedUri.AbsolutePath.Trim("/").Split("/")
          if ($resolvedSegments.Count -lt 2) { throw "Resolved Tauri WebView2 URL has no GUID/file path" }
          $resolvedGuid = $resolvedSegments[$resolvedSegments.Count - 2]
          $resolvedFileName = [Uri]::UnescapeDataString($resolvedSegments[$resolvedSegments.Count - 1])
          $parsedResolvedGuid = [Guid]::Empty
          if (-not [Guid]::TryParse($resolvedGuid, [ref]$parsedResolvedGuid) -or
              [string]::IsNullOrWhiteSpace($resolvedFileName)) {
            throw "Resolved Tauri WebView2 URL has an invalid GUID or file name"
          }
          $cache = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\.tauri\x64\$resolvedGuid"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $installer = Join-Path $cache $resolvedFileName
          Copy-Item -LiteralPath $reviewedInstaller -Destination $installer -Force
          $cachedHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($cachedHash -ne $env:WEBVIEW2_SHA256.ToLowerInvariant()) {
            throw "Tauri WebView2 cache does not contain the reviewed SHA-256"
          }
          Write-Host "Bound reviewed WebView2 payload to Tauri cache key $resolvedGuid/$resolvedFileName"

      - name: Download and stage reviewed Windows FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "FFMPEG_URL",
            "FFMPEG_SHA256",
            "FFMPEG_LICENSE_URL",
            "FFMPEG_LICENSE_SHA256",
            "FFMPEG_NOTICE_URL",
            "FFMPEG_NOTICE_SHA256",
            "FFMPEG_BUILD_ID"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing pinned release input: $name"
            }
          }
          if (([Uri]$env:FFMPEG_URL).Scheme -ne "https" -or
              ([Uri]$env:FFMPEG_LICENSE_URL).Scheme -ne "https" -or
              ([Uri]$env:FFMPEG_NOTICE_URL).Scheme -ne "https") {
            throw "FFmpeg binary, license, and notice URLs must use HTTPS"
          }
          $dependencyRoot = Join-Path $env:RUNNER_TEMP "ffmpeg-reviewed"
          New-Item -ItemType Directory -Path $dependencyRoot | Out-Null
          $binary = Join-Path $dependencyRoot "ffmpeg.exe"
          $license = Join-Path $dependencyRoot "FFmpeg-LICENSE.txt"
          $notice = Join-Path $dependencyRoot "FFmpeg-BUILD-README.txt"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $binary
          Invoke-WebRequest -Uri $env:FFMPEG_LICENSE_URL -OutFile $license
          Invoke-WebRequest -Uri $env:FFMPEG_NOTICE_URL -OutFile $notice
          $licenseHash = (Get-FileHash -LiteralPath $license -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($licenseHash -ne $env:FFMPEG_LICENSE_SHA256.ToLowerInvariant()) {
            throw "Reviewed FFmpeg license SHA-256 mismatch"
          }
          $noticeHash = (Get-FileHash -LiteralPath $notice -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($noticeHash -ne $env:FFMPEG_NOTICE_SHA256.ToLowerInvariant()) {
            throw "Reviewed FFmpeg build notice SHA-256 mismatch"
          }
          .\scripts\stage-ffmpeg.ps1 `
            -Source $binary `
            -ExpectedSha256 $env:FFMPEG_SHA256 `
            -LicenseFile @($license, $notice) `
            -SourceUrl $env:FFMPEG_URL `
            -BuildId $env:FFMPEG_BUILD_ID `
            -ReviewedPortable

      - name: Create separate Windows installer and updater configurations
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerConfig = [ordered]@{
            bundle = [ordered]@{
              useLocalToolsDir = $true
            }
          }
          $updaterConfig = [ordered]@{
            bundle = [ordered]@{
              useLocalToolsDir = $true
              windows = [ordered]@{
                webviewInstallMode = [ordered]@{
                  type = "downloadBootstrapper"
                  silent = $true
                }
              }
            }
          }
          $installerConfigPath = Join-Path $env:RUNNER_TEMP "tauri-release-installer.json"
          $updaterConfigPath = Join-Path $env:RUNNER_TEMP "tauri-release-updater.json"
          [IO.File]::WriteAllText($installerConfigPath, (($installerConfig | ConvertTo-Json -Depth 8) + "`n"))
          [IO.File]::WriteAllText($updaterConfigPath, (($updaterConfig | ConvertTo-Json -Depth 8) + "`n"))

      - name: Build unsigned offline NSIS installer
        run: pnpm tauri build --ci --bundles nsis --no-sign --config "$env:RUNNER_TEMP\tauri-release-installer.json"

      - name: Verify unsigned state, install, launch, resources, and uninstall
        shell: pwsh
        run: |
          .\scripts\verify-release-windows.ps1 `
            -Version "${{ needs.controller.outputs.version }}" `
            -Tag "${{ needs.controller.outputs.tag }}" `
            -Commit "${{ needs.controller.outputs.commit }}" `
            -WebView2Url "$env:WEBVIEW2_URL" `
            -WebView2Sha256 "$env:WEBVIEW2_SHA256" `
            -OutputDirectory "$env:RUNNER_TEMP\release-assets"

      - name: Build bounded NSIS updater without duplicate WebView2 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsisDirectory = "src-tauri\target\release\bundle\nsis"
          if (Test-Path -LiteralPath $nsisDirectory) {
            Remove-Item -LiteralPath $nsisDirectory -Recurse -Force
          }
          pnpm tauri build --ci --bundles nsis --no-sign --config "$env:RUNNER_TEMP\tauri-release-updater.json"
          if ($LASTEXITCODE -ne 0) { throw "Failed to build the NSIS updater installer" }

      - name: Sign and stage bounded Windows updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $updaters = @(Get-ChildItem -LiteralPath "src-tauri\target\release\bundle\nsis" -File -Filter "*.exe")
          if ($updaters.Count -ne 1) {
            throw "Expected exactly one NSIS updater installer, found $($updaters.Count)"
          }
          if ($updaters[0].Length -lt 1MB -or $updaters[0].Length -gt 64MB) {
            throw "NSIS updater installer is outside the 1-64 MiB bounded-memory contract"
          }
          $scratch = Join-Path $env:RUNNER_TEMP "nsis-updater-contents"
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          & $sevenZip x -y "-o$scratch" $updaters[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not extract the NSIS updater" }
          $webViewPayloads = @(Get-ChildItem -LiteralPath $scratch -Recurse -File -Filter "MicrosoftEdgeWebView2RuntimeInstaller*.exe")
          if ($webViewPayloads.Count -ne 0) {
            throw "NSIS updater must not duplicate the offline WebView2 payload"
          }
          $apps = @(Get-ChildItem -LiteralPath $scratch -Recurse -File -Filter "dohc-viewer.exe")
          $ffmpegs = @(Get-ChildItem -LiteralPath $scratch -Recurse -File -Filter "ffmpeg.exe")
          $manifests = @(Get-ChildItem -LiteralPath $scratch -Recurse -File -Filter "ffmpeg-manifest.json")
          $licenses = @(Get-ChildItem -LiteralPath $scratch -Recurse -File -Filter "FFmpeg.txt")
          if ($apps.Count -ne 1 -or $ffmpegs.Count -ne 1 -or $manifests.Count -ne 1 -or $licenses.Count -ne 1) {
            throw "NSIS updater is missing the application or reviewed FFmpeg resources"
          }
          $updaterAuthenticode = Get-AuthenticodeSignature -LiteralPath $updaters[0].FullName
          $appAuthenticode = Get-AuthenticodeSignature -LiteralPath $apps[0].FullName
          if ($updaterAuthenticode.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned -or
              $appAuthenticode.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "NSIS updater or application unexpectedly contains Authenticode"
          }
          pnpm tauri signer sign $updaters[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Failed to sign the NSIS updater archive" }
          $signature = "$($updaters[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) {
            throw "NSIS updater signature is missing"
          }
          $name = "DOHC-Viewer_${{ needs.controller.outputs.version }}_UNSIGNED_windows-x64-updater.exe"
          Copy-Item -LiteralPath $updaters[0].FullName -Destination (Join-Path $env:RUNNER_TEMP "release-assets\$name")
          Copy-Item -LiteralPath $signature -Destination (Join-Path $env:RUNNER_TEMP "release-assets\$name.sig")

      - name: Attest Windows installer provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/release-assets/DOHC-Viewer_${{ needs.controller.outputs.version }}_UNSIGNED_windows-x64-setup.exe

      - name: Upload verified Windows release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS 12+ arm64 unsigned DMG
    needs: controller
    if: ${{ needs.controller.outputs.should_release == 'true' }}
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      FFMPEG_SOURCE_URL: https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n8.1.2
      FFMPEG_SOURCE_SHA256: 9fd092511605bbebafe095ea6d38d9e40f34d12f7386e1258372df8be0576eb7
      FFMPEG_SOURCE_REVISION: 38b88335f99e76ed89ff3c93f877fdefce736c13
      FFMPEG_BUILD_ID: ffmpeg-8.1.2-dohc-minimal-lgpl
    steps:
      - name: Check out bound release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.controller.outputs.commit }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "./src-tauri -> target"
          key: release-aarch64-apple-darwin
          cache-bin: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event.workflow_run.head_sha == needs.controller.outputs.commit }}

      - name: Reverify immutable release provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          node scripts/verify-release.mjs --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" --expected-tag-object "$RELEASE_TAG_OBJECT" --trusted-main-ref "HEAD" --expected-trusted-main-commit "$RELEASE_COMMIT"
        env:
          RELEASE_TAG: ${{ needs.controller.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.controller.outputs.commit }}
          RELEASE_TAG_OBJECT: ${{ needs.controller.outputs.tag_object }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and stage reviewed macOS FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          source_archive="$RUNNER_TEMP/ffmpeg-n8.1.2.tar.gz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --silent \
            --show-error \
            "$FFMPEG_SOURCE_URL" \
            --output "$source_archive"
          bash scripts/build-ffmpeg-macos.sh \
            --source-archive "$source_archive" \
            --expected-source-sha256 "$FFMPEG_SOURCE_SHA256" \
            --source-url "$FFMPEG_SOURCE_URL" \
            --source-revision "$FFMPEG_SOURCE_REVISION" \
            --build-id "$FFMPEG_BUILD_ID"

      - name: Build ad-hoc-sealed app and headless DMG
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          set -euo pipefail
          pnpm tauri build --ci --target aarch64-apple-darwin --bundles app --no-sign
          bundle_root="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app_count="$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          [[ "$app_count" == "1" ]] || { echo "Expected one app bundle, found $app_count" >&2; exit 1; }
          app="$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print)"
          bash scripts/seal-macos-app-adhoc.sh --app "$app"
          updater="$bundle_root/macos/DOHC-Viewer_${{ needs.controller.outputs.version }}_UNSIGNED_macos-arm64.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$updater" -C "$(dirname "$app")" "$(basename "$app")"
          updater_size="$(stat -f '%z' "$updater")"
          (( updater_size >= 1048576 && updater_size <= 67108864 )) || {
            echo "macOS updater archive is outside the 1-64 MiB bounded-memory contract" >&2
            exit 1
          }
          mkdir -p "$bundle_root/dmg"
          bash scripts/make-dmg.sh \
            --app "$app" \
            --output "$bundle_root/dmg/DOHC-Viewer_${{ needs.controller.outputs.version }}_arm64.dmg"

      - name: Verify ad-hoc seal, Gatekeeper state, DMG, resources, and startup
        shell: bash
        run: |
          bash scripts/verify-release-macos.sh \
            --target aarch64-apple-darwin \
            --arch arm64 \
            --version "${{ needs.controller.outputs.version }}" \
            --tag "${{ needs.controller.outputs.tag }}" \
            --commit "${{ needs.controller.outputs.commit }}" \
            --output "$RUNNER_TEMP/release-assets"

      - name: Verify, sign, and stage macOS updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          updater="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/DOHC-Viewer_${{ needs.controller.outputs.version }}_UNSIGNED_macos-arm64.app.tar.gz"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          tar -xzf "$updater" -C "$scratch"
          extracted_count="$(find "$scratch" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          [[ "$extracted_count" == "1" ]] || { echo "Updater archive must contain one app" >&2; exit 1; }
          extracted_app="$(find "$scratch" -maxdepth 1 -type d -name '*.app' -print)"
          codesign --verify --deep --strict "$extracted_app"
          pnpm tauri signer sign "$updater"
          test -f "$updater.sig"
          cp "$updater" "$updater.sig" "$RUNNER_TEMP/release-assets/"

      - name: Attest macOS installer provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/release-assets/DOHC-Viewer_${{ needs.controller.outputs.version }}_UNSIGNED_macos-arm64.dmg

      - name: Upload verified macOS release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30

  linux_deb:
    name: Ubuntu 22.04+ x86_64 unsigned deb
    needs: controller
    if: ${{ needs.controller.outputs.should_release == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      FFMPEG_SOURCE_URL: https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n8.1.2
      FFMPEG_SOURCE_SHA256: 9fd092511605bbebafe095ea6d38d9e40f34d12f7386e1258372df8be0576eb7
      FFMPEG_SOURCE_REVISION: 38b88335f99e76ed89ff3c93f877fdefce736c13
      FFMPEG_BUILD_ID: ffmpeg-8.1.2-dohc-minimal-lgpl
    steps:
      - name: Check out bound release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.controller.outputs.commit }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "./src-tauri -> target"
          key: release-linux-x64
          cache-bin: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event.workflow_run.head_sha == needs.controller.outputs.commit }}

      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            dbus-x11 \
            elfutils \
            file \
            jq \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xvfb

      - name: Reverify immutable release provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          node scripts/verify-release.mjs --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" --expected-tag-object "$RELEASE_TAG_OBJECT" --trusted-main-ref "HEAD" --expected-trusted-main-commit "$RELEASE_COMMIT"
        env:
          RELEASE_TAG: ${{ needs.controller.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.controller.outputs.commit }}
          RELEASE_TAG_OBJECT: ${{ needs.controller.outputs.tag_object }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and stage reviewed Linux FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          source_archive="$RUNNER_TEMP/ffmpeg-n8.1.2.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            "$FFMPEG_SOURCE_URL" --output "$source_archive"
          bash scripts/build-ffmpeg-linux.sh \
            --source-archive "$source_archive" \
            --expected-source-sha256 "$FFMPEG_SOURCE_SHA256" \
            --source-url "$FFMPEG_SOURCE_URL" \
            --source-revision "$FFMPEG_SOURCE_REVISION" \
            --build-id "$FFMPEG_BUILD_ID"

      - name: Build unsigned Linux Debian package
        run: pnpm tauri build --ci --bundles deb --no-sign

      - name: Stage, install, and verify Ubuntu 22.04+ Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find src-tauri/target -type f -path '*/release/bundle/deb/*.deb' -print -quit)"
          [[ -n "$deb" ]] || { echo "Tauri did not produce a Debian package" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/release-assets"
          formal_deb="$RUNNER_TEMP/release-assets/DOHC-Viewer_${{ needs.controller.outputs.version }}_UNSIGNED_ubuntu-22.04+-x64.deb"
          install -m 0644 "$deb" "$formal_deb"
          bash scripts/verify-release-deb.sh \
            --deb "$formal_deb" \
            --version "${{ needs.controller.outputs.version }}" \
            --tag "${{ needs.controller.outputs.tag }}" \
            --commit "${{ needs.controller.outputs.commit }}" \
            --output-directory "$RUNNER_TEMP/release-assets"

      - name: Sign verified Ubuntu deb for automatic updates
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          deb="$RUNNER_TEMP/release-assets/DOHC-Viewer_${{ needs.controller.outputs.version }}_UNSIGNED_ubuntu-22.04+-x64.deb"
          size="$(stat -c '%s' "$deb")"
          (( size >= 1048576 && size <= 67108864 )) || {
            echo "Ubuntu updater deb is outside the 1-64 MiB bounded-memory contract" >&2
            exit 1
          }
          pnpm tauri signer sign "$deb"
          test -f "$deb.sig"

      - name: Attest Ubuntu deb provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/release-assets/DOHC-Viewer_${{ needs.controller.outputs.version }}_UNSIGNED_ubuntu-22.04+-x64.deb

      - name: Upload verified Ubuntu deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ubuntu-deb-x64
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish complete GitHub Release
    needs: [controller, windows, macos, linux_deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out bound release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.controller.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Reverify immutable release provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          node scripts/verify-release.mjs --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" --expected-tag-object "$RELEASE_TAG_OBJECT" --trusted-main-ref "HEAD" --expected-trusted-main-commit "$RELEASE_COMMIT"
        env:
          RELEASE_TAG: ${{ needs.controller.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.controller.outputs.commit }}
          RELEASE_TAG_OBJECT: ${{ needs.controller.outputs.tag_object }}

      - name: Download all verified platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/release-inputs
          merge-multiple: true

      - name: Assemble and cross-check complete release
        run: |
          node scripts/assemble-release.mjs \
            --input "$RUNNER_TEMP/release-inputs" \
            --output "$RUNNER_TEMP/release-assets" \
            --tag "${{ needs.controller.outputs.tag }}" \
            --commit "${{ needs.controller.outputs.commit }}"

      - name: Render required release changelog
        run: |
          node scripts/release-changelog.mjs \
            --version "${{ needs.controller.outputs.version }}" \
            --output "$RUNNER_TEMP/release-changelog.md"

      - name: Attest final release set
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

      - name: Publish only after every unsigned installer passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.controller.outputs.tag }}
          VERSION: ${{ needs.controller.outputs.version }}
          PRERELEASE: ${{ needs.controller.outputs.prerelease }}
          ASSET_DIR: ${{ runner.temp }}/release-assets
          CHANGELOG_NOTES: ${{ runner.temp }}/release-changelog.md
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          WARNING: This release has no trusted publisher signature. Windows will show an unknown-publisher or SmartScreen warning. The macOS app has a valid local ad-hoc resource seal but no Developer ID or notarization, so first launch requires the standard System Settings > Privacy & Security > Open Anyway override. The Ubuntu deb package is unsigned; verify SHA256SUMS.txt before use.

          Three compiled installers are attached: Windows x64, macOS Apple Silicon, and Ubuntu 22.04+ x86_64 deb. All three passed dependency, bundled-resource, install or mount, startup, checksum, and automatic-update signature gates before publication. The macOS job also passed strict nested-code/resource verification and a synthetic-quarantine policy check. A runner-only Internal Xprotect Error is accepted only when an independently built minimal control app produces the same result; this state is recorded in the verification report. Product-only XProtect errors and all structural signature errors block publication. Authenticode, Developer ID, Apple notarization, and trusted Linux package signing are intentionally not claimed; the separate Minisign signature authenticates only in-app update payloads.

          Installed clients do not need GitHub access. The fixed update mirror at http://39.155.172.162:17879 synchronizes this immutable release, verifies the complete set, and serves the signed updater payloads locally.

          User guide: https://github.com/${{ github.repository }}/wiki

          Linux distribution: this release publishes only the Ubuntu 22.04+ x86_64 deb. Flatpak is not supported, and Ubuntu 20.04 has no binary.

          EOF
          cat "$CHANGELOG_NOTES" >> "$notes_file"
          printf '\nFull version history: https://github.com/${{ github.repository }}/blob/%s/CHANGELOG.md\n' "$TAG" >> "$notes_file"

          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            [[ "$is_draft" == "true" ]] || {
              echo "A published release already exists for immutable tag $TAG" >&2
              exit 1
            }
            while IFS= read -r existing_asset; do
              [[ -z "$existing_asset" ]] || gh release delete-asset "$TAG" "$existing_asset" --yes
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release edit "$TAG" --title "DOHC Viewer $TAG (UNSIGNED)" --notes-file "$notes_file"
          else
            create_args=("$TAG" --verify-tag --draft --title "DOHC Viewer $TAG (UNSIGNED)" --notes-file "$notes_file")
            if [[ "$PRERELEASE" == "true" ]]; then create_args+=(--prerelease); fi
            gh release create "${create_args[@]}"
          fi

          release_body="$(gh release view "$TAG" --json body --jq .body)"
          grep -Fq "### $VERSION - " <<< "$release_body"

          gh release upload "$TAG" "$ASSET_DIR"/* --clobber
          find "$ASSET_DIR" -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/local-assets.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/remote-assets.txt"
          diff -u "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt"

          edit_args=("$TAG" --draft=false)
          if [[ "$PRERELEASE" != "true" ]]; then edit_args+=(--latest); fi
          gh release edit "${edit_args[@]}"
