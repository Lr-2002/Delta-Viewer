<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOHC 运行配置</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--surface:#fff;--text:#17202a;--muted:#66727d;--line:#d7dde3;--info:#1769aa;--fail:#b42318;--ok:#087443}
@media(prefers-color-scheme:dark){:root{--bg:#11161b;--surface:#182027;--text:#eef2f5;--muted:#aab4bd;--line:#35414b;--info:#61b3f4;--fail:#ff8f87;--ok:#5ed69d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:860px;margin:0 auto;padding:24px 20px 42px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px}h1{font-size:22px;margin:0}p{color:var(--muted)}a{color:var(--info)}section{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:18px;padding:18px}.field{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,300px);gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.field:first-child{border-top:0}.field label{font-weight:600}.field small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.field select,.field input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--text);font:inherit}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}button{padding:8px 14px;border:1px solid var(--info);border-radius:4px;background:var(--info);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{min-height:24px;color:var(--muted)}.error{color:var(--fail)!important}.ok{color:var(--ok)!important}@media(max-width:600px){main{padding:18px 12px 32px}.field{grid-template-columns:1fr;gap:6px}}
</style>
</head>
<body><main>
<header><div><h1>DOHC 运行配置</h1><div>局域网维护页面</div></div><a href="/">返回状态</a></header>
<section><p>仅显示允许在线修改的运行参数。保存前请停止采集、QC 和压力测试。</p><label for="category">配置方向</label><select id="category" disabled></select><div id="categoryDescription"></div><div id="fields">正在读取配置...</div><div id="categoryLink"></div><div class="actions"><button id="save" type="button" disabled>保存并重启相关服务</button><span id="status"></span></div></section>
<section><p>页面没有登录认证，仅限受控设备局域网使用。不会显示密钥、路径或网络地址。</p></section>
</main>
<script>
const byId=id=>document.getElementById(id);let config=null;let selectedCategory='storage';
function setStatus(message,kind){const el=byId('status');el.textContent=message;el.className=kind||''}
function renderCategory(){const category=(config.categories||[]).find(item=>item.id===selectedCategory);byId('categoryDescription').textContent=category?category.description:'';const root=byId('fields');root.replaceChildren();const fields=(config.fields||[]).filter(field=>field.category===selectedCategory);fields.forEach(field=>{const row=document.createElement('div');row.className='field';const label=document.createElement('label');label.textContent=field.label;const key=document.createElement('small');key.textContent=field.key;label.append(key);row.append(label);let input;if(field.type==='select'){input=document.createElement('select');(field.choices||[]).forEach(choice=>{const option=document.createElement('option');option.value=choice.value;option.textContent=choice.label;input.append(option)});input.value=field.value}else{input=document.createElement('input');input.type='number';input.min=field.minimum;input.max=field.maximum;input.step='1';input.value=field.value}input.dataset.key=field.key;row.append(input);root.append(row)});const link=byId('categoryLink');link.replaceChildren();if(category&&category.href){const anchor=document.createElement('a');anchor.href=category.href;anchor.textContent='打开相机配置';link.append(anchor)}byId('save').disabled=fields.length===0}
function render(data){config=data;const select=byId('category');select.replaceChildren();(data.categories||[]).forEach(category=>{const option=document.createElement('option');option.value=category.id;option.textContent=category.label;select.append(option)});select.value=selectedCategory;select.disabled=false;select.addEventListener('change',()=>{selectedCategory=select.value;renderCategory()});renderCategory();setStatus('SHA-256 '+data.sha256,'')}
async function load(){try{const response=await fetch('/api/v1/runtime-config',{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.message||('HTTP '+response.status));render(data)}catch(error){setStatus('读取失败：'+error.message,'error')}}
async function save(){if(!config)return;const values={};document.querySelectorAll('[data-key]').forEach(input=>{values[input.dataset.key]=input.value});const button=byId('save');button.disabled=true;setStatus('正在保存并重启服务...','');try{const response=await fetch('/api/v1/runtime-config',{method:'PUT',headers:{'Content-Type':'application/json','If-Match':config.sha256},body:JSON.stringify({values})});const data=await response.json();if(!response.ok)throw new Error(data.message||('HTTP '+response.status));config.sha256=data.sha256;setStatus(data.message+' | SHA-256 '+data.sha256,'ok')}catch(error){setStatus('保存失败：'+error.message,'error')}finally{button.disabled=false}}
byId('save').addEventListener('click',save);load();
</script></body></html>
